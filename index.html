<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SONIC LUMINATION MATRIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrapper">
      <h1>SONIC LUMINATION MATRIX</h1>
      <div id="canvas-holder"></div>
      <div id="slider-holder"></div>
      <div id="author">BAMBOO ZHU</div>
    </div>

    <div id="intro-overlay">
      <div class="intro-card">
        <h2>Your body,<br/>reconstructed in light cubes</h2>
        <p class="sub">
          Play your favourite song aloud — let the sound reshape your body.<br/>
          Drag the slider to dissolve or resolve the grid.
        </p>
        <p class="note">Allow camera and microphone to continue.</p>
        <button class="intro-enter" id="intro-enter">Enter</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
